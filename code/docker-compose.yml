networks:
  public-net:
    driver: bridge
  internal-net:
    name: internal-net
    driver: bridge
  sec-net:
    name: sec-net
    driver: bridge

volumes:
  requests-data:
    name: secure-requests-data

services:


  frontend: 
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: frontend
    ports:
     - "3000:3000"  
    networks:
      - "public-net" 
    volumes: 
      - ./frontend:/app             
      - /app/node_modules        
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000  
      - INTERNAL_API_URL=http://api:8000

  # 1. API Gateway (FastAPI)
  api:
    build:
      context: ./api
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - .env
    networks:
      - public-net
      - internal-net
    depends_on:
      rabbitmq:
        condition: service_healthy

  # 2. Message Broker (RabbitMQ)
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq-broker
    restart: unless-stopped
    ports:
      - "5672:5672" # AMQP para los microservicios
      - "15672:15672" # UI Management
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
    volumes:
      - ./enable_plugins:/etc/rabbitmq/enabled_plugins:ro
    networks:
      - internal-net
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # 3. Controlador de Skills (Servidor MCP + Docker Socket)
  skills-controller:
    build:
      context: ./skills_controller
      dockerfile: Dockerfile.skills_controller
    container_name: ctnr-skills-controller
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Acceso al Engine de Docker
      - requests-data:/app/requests
    env_file:
      - .env
    networks:
      - internal-net
    depends_on:
      rabbitmq:
        condition: service_healthy

  # 4. Orquestador Principal (LLM Router)
  orchestrator:
    build:
      context: ./agents
      dockerfile: orchestrator/Dockerfile.orchestrator
    ports:
      - "8001:8001"
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - public-net
      - internal-net
    depends_on:
      rabbitmq:
        condition: service_healthy

  # 5. Agente de Reconocimiento
  recon-agent:
    build:
      context: ./agents
      dockerfile: recon/Dockerfile.recon
    env_file:
      - .env
    volumes:
      - requests-data:/app/requests
    networks:
      - sec-net
      - internal-net
    depends_on:
      rabbitmq:
        condition: service_healthy

  # 6. Agente de Validación
  validate-agent:
    build:
      context: ./agents
      dockerfile: validate/Dockerfile.validate
    env_file:
      - .env
    networks:
      - sec-net
      - internal-net
    depends_on:
      rabbitmq:
        condition: service_healthy

  # 7. Agente Reportador (Generación de Informes Markdown)
  reporter-agent:
    build:
      context: ./agents
      dockerfile: reporter/Dockerfile.reporter
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - sec-net
      - internal-net
    depends_on:
      rabbitmq:
        condition: service_healthy

  # 8. Entorno Vulnerable: WebGoat
  webgoat:
    image: webgoat/webgoat:latest
    container_name: webgoat-target
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "8080:8080"
    networks:
      - sec-net

  # 9. Entorno Vulnerable: OWASP Juice Shop
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: juice-shop-target
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "3001:3000"
    networks:
      - sec-net
