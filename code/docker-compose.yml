networks:
  public-net:
    driver: bridge
  internal-net:
    name: internal-net
    driver: bridge
  sec-net:
    name: sec-net
    driver: bridge

services:


  frontend: 
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: frontend
    ports:
     - "3000:3000"  
    networks:
      - "public-net" 
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - INTERNAL_API_URL=http://api:8000
    depends_on:
      - api

  # 1. API Gateway (FastAPI)
  api:
    build:
      context: ./api
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - .env
    networks:
      - public-net
      - internal-net
    depends_on:
      rabbitmq:
        condition: service_healthy

  # 2. Message Broker (RabbitMQ)
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq-broker
    restart: unless-stopped
    ports:
      - "5672:5672" # AMQP para los microservicios
      - "15672:15672" # UI Management
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
    volumes:
      - ./enable_plugins:/etc/rabbitmq/enabled_plugins:ro,z
    networks:
      - internal-net
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # 3. Controlador de Skills (Servidor MCP + Docker Socket)
  skills-controller:
    build:
      context: ./skills_controller
      dockerfile: Dockerfile.skills_controller
    container_name: ctnr-skills-controller
    security_opt:
      - label=disable # SELinux (Fedora) bloquea el acceso al docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Acceso al Engine de Docker
      - ./skills_controller/tools/sqli_map/outputs:/app/tools/sqli_map/outputs
      - ./skills_controller/tools/sqli_skill/outputs:/app/tools/sqli_skill/outputs
    environment:
      - PYTHONPATH=.
    env_file:
      - .env
    networks:
      - internal-net
      - sec-net
    depends_on:
      rabbitmq:
        condition: service_healthy
      build-sqli-map:
        condition: service_completed_successfully

  # 4. Orquestador Principal (LLM Router)
  orchestrator:
    build:
      context: ./agents
      dockerfile: orchestrator/Dockerfile.orchestrator
    ports:
      - "8001:8001"
    environment:
      - PYTHONPATH=.
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - public-net
      - internal-net
    extra_hosts:
      - "host.docker.internal:host-gateway" # Docker Engine nativo en Linux no lo resuelve solo
    depends_on:
      rabbitmq:
        condition: service_healthy

  # 5. Agente de Reconocimiento
  recon-agent:
    build:
      context: ./agents
      dockerfile: recon/Dockerfile.recon
    env_file:
      - .env
    environment:
      - RECON_CONTEXT_OUTPUT_DIR=/app/recon_context
    volumes:
      - ./agents/recon/recon_context:/app/recon_context
    networks:
      - sec-net
      - internal-net
    extra_hosts:
      - "host.docker.internal:host-gateway" # Docker Engine nativo en Linux no lo resuelve solo
    depends_on:
      rabbitmq:
        condition: service_healthy

  # 6. Agente de Validación
  validate-agent:
    build:
      context: ./agents
      dockerfile: validate/Dockerfile.validate
    env_file:
      - .env
    environment:
      - VALIDATE_CONTEXT_OUTPUT_DIR=/app/validate_context
    volumes:
      - ./agents/validate/validate_context:/app/validate_context
    networks:
      - sec-net
      - internal-net
    extra_hosts:
      - "host.docker.internal:host-gateway" # Docker Engine nativo en Linux no lo resuelve solo
    depends_on:
      rabbitmq:
        condition: service_healthy

  # 7. Agente Reportador (Generación de Informes Markdown)
  reporter-agent:
    build:
      context: ./agents
      dockerfile: reporter/Dockerfile.reporter
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - sec-net
      - internal-net
    extra_hosts:
      - "host.docker.internal:host-gateway" # Docker Engine nativo en Linux no lo resuelve solo
    depends_on:
      rabbitmq:
        condition: service_healthy

  build-spa-crawler:
    build:
      context: ./skills_controller
      dockerfile: docker_images/Dockerfile.spa_crawler
    image: local-spa-crawler:latest
    command: ["--help"]

  build-crawler:
    build:
      context: ./skills_controller
      dockerfile: docker_images/Dockerfile.crawler
    image: local-crawler:latest
    command: ["--help"]

  build-deep-crawler:
    build:
      context: ./skills_controller
      dockerfile: docker_images/Dockerfile.deep_crawler
    image: local-deep-crawler:latest
    command: ["--help"]

  build-sqli-map:
    build:
      context: ./skills_controller
      dockerfile: docker_images/Dockerfile.sqli_map
    image: local-sqli-map:latest
    command: ["--help"]

  build-crypto-inspector:
    build:
      context: ./skills_controller
      dockerfile: docker_images/Dockerfile.crypto_inspector
    image: local-crypto-inspector:latest
    command: ["--help"]

  # 8. Entorno Vulnerable: WebGoat
  webgoat:
    image: webgoat/webgoat:latest
    container_name: webgoat-target
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "8080:8080"
    networks:
      - sec-net

  # 9. Entorno Vulnerable: OWASP Juice Shop
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: juice-shop-target
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "3001:3000"
    networks:
      - sec-net

  pygoat:
    image: pygoat/pygoat:latest
    container_name: pygoat-target
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "3002:8000"
    networks:
      - sec-net
  

  wackopicko:
    image: adamdoupe/wackopicko:latest
    container_name: wackopicko-target
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:3003:80"
    networks:
      - sec-net

