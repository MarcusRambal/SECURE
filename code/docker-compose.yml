networks:
  public-net:
    driver: bridge
  internal-net:
    driver: bridge
  sec-net:
    driver: bridge

services:
  
  # 2. API Gateway (FastAPI)
  api:
    build:
      context: ./api
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - .env 
    networks:
      - public-net
      - internal-net 
    depends_on:
      - rabbitmq

  # 3. Message Broker (RabbitMQ)
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq-broker
    restart: unless-stopped
    ports:
      - "5672:5672"   # Puerto de comunicación AMQP (para los microservicios)
      - "15672:15672" # Puerto de la interfaz web (UI Management)
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
    volumes:
      - ./enable_plugins:/etc/rabbitmq/enabled_plugins:ro
    networks:
      - internal-net 

    # 8. Controlador de Skills (Servidor MCP + Docker Socket)

  skills-controller:
    build:
      context: ./skills_controller
      dockerfile: Dockerfile.skills_controller
    ports:
      - "8001:8001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Acceso al socket de Docker

    networks:
      - internal-net
      - sec-net

  agents:
    build:
      context: ./agents/orchestrator
      dockerfile: Dockerfile.orchestrator
    ports:
      - "8002:8002"
    networks:
      - internal-net
      - sec-net
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - TARGET_URL=http://webgoat:8080/WebGoat


  webgoat:
    image: webgoat/webgoat:latest
    container_name: webgoat-target
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - sec-net

  
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: juice-shop-target
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - sec-net