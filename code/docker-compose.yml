networks:
  public-net:
    driver: bridge
  internal-net:
    driver: bridge
  sec-net:
    driver: bridge

services:

  # 1. API Gateway (FastAPI)
  api:
    build:
      context: ./api
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - .env
    networks:
      - public-net
      - internal-net
    depends_on:
      - rabbitmq

  # 2. Message Broker (RabbitMQ)
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq-broker
    restart: unless-stopped
    ports:
      - "5672:5672"   # AMQP para los microservicios
      - "15672:15672" # UI Management
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
    volumes:
      - ./enable_plugins:/etc/rabbitmq/enabled_plugins:ro
    networks:
      - internal-net

  # 3. Controlador de Skills (Servidor MCP + Docker Socket)
  skills-controller:
    build:
      context: ./skills_controller
      dockerfile: Dockerfile.skills_controller
    ports:
      - "8001:8001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Acceso al socket de Docker
    networks:
      - internal-net
      - sec-net

# 4. Agente de Reconocimiento
  recon-agent:
    build:
      context: ./agents
      dockerfile: recon/Dockerfile.recon
    ports:
      - "8003:8003"
    networks:
      sec-net:
        aliases:
          - recon-agent
      internal-net:
    environment:
      - TESTER_AGENT_URL=http://validate-agent:8002/validate
      - GROQ_API_KEY=${GROQ_API_KEY}
      - TARGET_URL=http://juice-shop:3000/#/login
    depends_on:
      - juice-shop
      - validate-agent
  
  # Agente de Validación
  validate-agent:
    build:
      context: ./agents
      dockerfile: validate/Dockerfile.validate
    ports:
      - "8002:8002"
    networks:
      sec-net:
        aliases:
          - validate-agent
      internal-net:
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      - juice-shop

    

  # 5. Entorno Vulnerable: WebGoat
  webgoat:
    image: webgoat/webgoat:latest
    container_name: webgoat-target
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "8080:8080" 
    networks:
      - sec-net

  # 6. Entorno Vulnerable: OWASP Juice Shop
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: juice-shop-target
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "3000:3000"
    networks:
      - sec-net